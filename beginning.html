<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>How It Started...</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #C4AE91;
            color: #1E1E1E;
            font-family: Georgia, serif;
        }

        .page {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
            padding-top: 55px;
        }

        h1 {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 42px;
            font-weight: 500;
            letter-spacing: 3px;
            margin: 0 0 12px 0;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .divider span:first-child,
        .divider span:last-child {
            width: 45px;
            height: 1px;
            background: #1E1E1E;
            opacity: 0.65;
        }

        .tiny-heart {
            font-size: 12px;
            color: #1E1E1E;
        }

        .intro {
            font-family: Georgia, serif;
            font-size: 19px;
            font-style: italic;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="page">

        <h1>HOW IT STARTED...</h1>

        <div class="divider">
            <span></span>
            <span class="tiny-heart">♥</span>
            <span></span>
        </div>

        <p class="intro">
            Every story has a beginning. This is ours.
        </p>

    </div>

</body>

</html>
