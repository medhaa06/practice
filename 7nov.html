<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>7th November</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #C4AE91;
            color: #1E1E1E;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        .page {
            width: 88%;
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 55px;
            text-align: center;
        }

        h1 {
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 46px;
            font-weight: 500;
            letter-spacing: 4px;
            margin: 0 0 55px 0;
        }

        .story {
            max-width: 720px;
            margin: 0 auto;
        }

        .line {
            font-size: 23px;
            line-height: 1.7;
            margin: 0 0 35px 0;

            opacity: 0;
            transform: translateX(100px);

            animation: slideIn 1s ease forwards;
        }

        .line1 {
            animation-delay: 0.4s;
        }

        .line2 {
            animation-delay: 1.1s;
        }

        .line3 {
            animation-delay: 1.8s;
        }

        @keyframes slideIn {

            from {
                opacity: 0;
                transform: translateX(100px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

    </style>

</head>

<body>

    <div class="page">

        <h1>7TH NOVEMBER</h1>

        <div class="story">

            <p class="line line1">
                Dares. Bets.
            </p>

            <p class="line line2">
                And uhhh... I don't really need to mention what happened next.
            </p>

            <p class="line line3">
                But I guess that was the best decision I have ever made.
            </p>

        </div>

    </div>

</body>

</html>
